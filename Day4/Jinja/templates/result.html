<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>result</title>
</head>
<body>
    <div><h1>Result of {{ name }}</h1></div>
    <div>{{ marks }}</div>
    <div>
        {% if marks >= 80 %}
        <h2>passed with grade A</h2>
        {% elif marks >= 70 %}
        <h2>passed with grade B</h2>
        {% elif marks >= 60 %}  
        <h2>passed with grade C</h2>
        {% elif marks >= 50 %}
        <h2>passed with grade D</h2>
        {% else %}
        <h2>you are fail</h2>
        {% endif %} 
    </div>
</body>
</html>
